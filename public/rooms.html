<!DOCTYPE html>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rooms</title>
<link rel="icon" href="assets/icon-n.svg">
<link rel="manifest" href="manifest.json">
<script src="assets/app.js" type="module"></script>
<script src="components/room-list/element.js" type="module"></script>
<script src="components/room-name/element.js" type="module"></script>
<script src="components/room-name-input/element.js" type="module"></script>

<style>
  @import url(assets/global.css) layer(base);
  @import url(assets/element-resets.css) layer(base);
  @import url(assets/gutter.css) layer(layout);
  @import url(assets/header-nav.css) layer(component);
  @import url(assets/empty-link-list.css) layer(component);
  @layer base, layout, component;

  main {
    container-type: inline-size;
    margin: 0 calc(var(--body-gutter) * -1);
    display: flex;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    min-width: 0;

    &::before,
    &::after {
      content: '';
      flex: 0 0 50%;
    }

    >* {
      flex: 0 0 auto;
      width: max-content;
    }
  }

  .room-list-grid {
    box-sizing: border-box;
    display: grid;
    padding: 16px;
    grid-auto-flow: column;
    grid-auto-columns: min(100ch, 90cqi);
    gap: min(3cqi, 16px);
    height: 100%;
  }

  h2 {
    text-align: center;
  }

  room-list {
    scroll-snap-align: center;
    border: 1px solid var(--color-button-border);
    border-radius: 10px;

    &:not(:defined) {
      display: none;
    }
  }
</style>

<body class="gutter">
  <header class="header-nav">
    <nav>
      <ul>
        <li><a href="/">Join Room</a>
        <li><a>Rooms</a>
        <li><a href="/settings">Settings</a>
      </ul>
    </nav>
  </header>
  <main>
    <div class="room-list-grid">
      <room-list>
        <h2><room-name></room-name></h2>
        <form method="post" action="/api/room/leave">
          <input type="hidden" name="returnTo" value="/rooms">
          <room-name-input name="room"></room-name-input>
          <button type="submit">Leave</button>
        </form>
        <room-messages>
          <room-message-iter>
            <room-message></room-message>
          </room-message-iter>
        </room-messages>
        <form method="post">
          <message-room></message-room>
          <input type="text" placeholder="Message" required>
          <button type="submit">Send</button>
        </form>
      </room-list>
    </div>
  </main>
</body>
